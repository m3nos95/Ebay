<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ad→eBay">
<meta name="theme-color" content="#0e0e0f">
<title>Ad → eBay Lister</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0e0e0f;
    --surface: #18191c;
    --surface2: #222327;
    --border: #2e2f34;
    --accent: #f5a623;
    --accent2: #e8380d;
    --text: #e8e8ea;
    --muted: #6b6d75;
    --green: #3ecf8e;
    --red: #e84040;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding: 16px;
    padding-bottom: 40px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
    flex-wrap: wrap;
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.6rem;
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }

  header span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .api-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    align-items: center;
    flex-wrap: wrap;
  }

  .api-bar label {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
    font-family: 'IBM Plex Mono', monospace;
  }

  .api-bar input {
    flex: 1;
    min-width: 180px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    padding: 9px 12px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }

  .api-bar input:focus { border-color: var(--accent); }

  .btn-sm {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    padding: 9px 14px;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-sm:hover { background: var(--accent); color: #000; border-color: var(--accent); }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .panel-header {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  .panel-header h2 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
  }

  .panel-body { padding: 16px; }

  .capture-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .btn-capture {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    padding: 14px 10px;
    border-radius: 4px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
    overflow: hidden;
  }

  .btn-capture input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .btn-capture:hover { border-color: var(--accent); color: var(--accent); }
  .btn-capture .icon { font-size: 1.4rem; }

  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 6px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    background: rgba(0,0,0,0.2);
  }

  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--accent);
    background: rgba(245,166,35,0.05);
  }

  .dropzone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .dropzone p { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
  .dropzone strong { color: var(--accent); }

  #preview-img {
    width: 100%;
    max-height: 260px;
    object-fit: contain;
    border-radius: 4px;
    display: none;
    margin-top: 12px;
    border: 1px solid var(--border);
  }

  .btn-analyze {
    width: 100%;
    margin-top: 12px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    border: none;
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.35rem;
    letter-spacing: 0.1em;
    padding: 13px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .btn-analyze:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(0,0,0,0.3);
    border-top-color: #000;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .status-bar {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    padding: 7px 0;
    text-align: center;
    min-height: 26px;
  }

  .status-bar.working { color: var(--accent); }
  .status-bar.done { color: var(--green); }
  .status-bar.error { color: var(--red); }

  .field-group { margin-bottom: 14px; }

  .field-group label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .field-group input,
  .field-group select,
  .field-group textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.83rem;
    padding: 8px 11px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
  }

  .field-group input:focus,
  .field-group select:focus,
  .field-group textarea:focus { border-color: var(--accent); }

  .field-group select option { background: var(--surface2); }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .ai-badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.52rem;
    background: rgba(245,166,35,0.15);
    color: var(--accent);
    border: 1px solid rgba(245,166,35,0.3);
    padding: 1px 5px;
    border-radius: 2px;
    letter-spacing: 0.08em;
    margin-left: 6px;
    vertical-align: middle;
  }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }

  .btn-ebay {
    background: #e53238;
    border: none;
    color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.25rem;
    letter-spacing: 0.08em;
    padding: 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .btn-ebay:hover { background: #c8222a; }
  .btn-ebay:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-copy {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.25rem;
    letter-spacing: 0.08em;
    padding: 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .btn-copy:hover { border-color: var(--accent); color: var(--accent); }
  .btn-copy:disabled { opacity: 0.35; cursor: not-allowed; }

  .info-card {
    background: rgba(62,207,142,0.05);
    border: 1px solid rgba(62,207,142,0.2);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--green);
    line-height: 1.8;
    white-space: pre-wrap;
    display: none;
  }

  .info-card.visible { display: block; }

  .placeholder-msg {
    text-align: center;
    padding: 50px 16px;
    color: var(--muted);
  }

  .placeholder-msg .big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    letter-spacing: 0.1em;
    color: var(--border);
    display: block;
    margin-bottom: 8px;
  }

  .placeholder-msg p { font-size: 0.78rem; line-height: 1.6; }

  #result-panel { display: none; }
  #result-panel.visible { display: block; }

  .char-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.58rem;
    color: var(--muted);
    text-align: right;
    margin-top: 2px;
  }

  .char-count.warn { color: var(--accent); }
  .char-count.over { color: var(--red); }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>Ad → eBay</h1>
  <span>AI Listing Generator · Snap or Upload Any Ad</span>
</header>

<div class="api-bar">
  <label>Anthropic Key:</label>
  <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
  <button class="btn-sm" onclick="saveKey()">Save</button>
</div>

<div class="layout">

  <div class="panel">
    <div class="panel-header">
      <div class="dot"></div>
      <h2>Scan Advertisement</h2>
    </div>
    <div class="panel-body">

      <!-- Hidden file inputs -->
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleFile(event)">
      <input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="handleFile(event)">

      <div class="capture-btns">
        <div class="btn-capture" onclick="document.getElementById('cameraInput').click()">
          <span class="icon">📷</span>
          <span>Take Photo</span>
        </div>
        <div class="btn-capture" onclick="document.getElementById('galleryInput').click()">
          <span class="icon">🖼️</span>
          <span>Browse File</span>
        </div>
      </div>

      <div class="dropzone" id="dropzone" onclick="document.getElementById('galleryInput').click()">
        <p>📁 <strong>Tap to pick a photo</strong><br>or drag and drop on desktop</p>
      </div>

      <img id="preview-img" alt="Ad preview">

      <button class="btn-analyze" id="analyzeBtn" onclick="analyzeAd()" disabled>
        <div class="spinner" id="spinner"></div>
        <span id="analyzeLabel">Scan & Build Listing</span>
      </button>
      <div class="status-bar" id="statusBar">Snap a photo or drop an ad to start</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="dot" style="background:var(--red)"></div>
      <h2>eBay Listing</h2>
    </div>
    <div class="panel-body">

      <div class="placeholder-msg" id="placeholderMsg">
        <span class="big">Awaiting Scan</span>
        <p>Snap or upload an ad and hit<br>Scan to auto-fill your listing.</p>
      </div>

      <div id="result-panel">
        <div class="info-card" id="infoCard"></div>

        <div class="field-group">
          <label>Title <span class="ai-badge">AI</span></label>
          <input type="text" id="title" maxlength="80" placeholder="eBay listing title" oninput="updateCharCount('title','titleCount',80)">
          <div class="char-count" id="titleCount">0 / 80</div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label>Price (USD) <span class="ai-badge">AI</span></label>
            <input type="number" id="price" placeholder="0.00" min="0" step="0.01">
          </div>
          <div class="field-group">
            <label>Condition <span class="ai-badge">AI</span></label>
            <select id="condition">
              <option value="1000">Brand New</option>
              <option value="1500">New Other</option>
              <option value="2000">Cert. Refurb</option>
              <option value="2500">Seller Refurb</option>
              <option value="3000" selected>Used</option>
              <option value="4000">Very Good</option>
              <option value="5000">Good</option>
              <option value="6000">Acceptable</option>
              <option value="7000">For Parts</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label>Category ID</label>
            <input type="text" id="categoryId" placeholder="e.g. 9355">
          </div>
          <div class="field-group">
            <label>Format</label>
            <select id="listingType">
              <option value="FixedPrice">Buy It Now</option>
              <option value="Chinese">Auction</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label>Description <span class="ai-badge">AI</span></label>
          <textarea id="description" rows="5" placeholder="Item description..."></textarea>
        </div>

        <div class="field-group">
          <label>Keywords <span class="ai-badge">AI</span></label>
          <input type="text" id="keywords" placeholder="comma, separated, keywords">
        </div>

        <div class="actions">
          <button class="btn-ebay" id="ebayBtn" onclick="openEbay()" disabled>🛒 List on eBay</button>
          <button class="btn-copy" id="copyBtn" onclick="copyListing()" disabled>📋 Copy</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
let imageBase64 = null;
let imageMimeType = null;

window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('anthropic_api_key');
  if (saved) document.getElementById('apiKey').value = saved;
  setupDragDrop();
});

function saveKey() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) return alert('Paste your Anthropic API key first.');
  localStorage.setItem('anthropic_api_key', key);
  setStatus('✓ Key saved', 'done');
}

function setupDragDrop() {
  const dz = document.getElementById('dropzone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) loadFile(file);
  });
}

function handleFile(e) {
  const file = e.target.files[0];
  if (file) loadFile(file);
}

function loadFile(file) {
  if (!file.type.startsWith('image/')) return alert('Please use an image file.');
  imageMimeType = file.type;
  const reader = new FileReader();
  reader.onload = ev => {
    imageBase64 = ev.result.split(',')[1];
    const img = document.getElementById('preview-img');
    img.src = ev.result;
    img.style.display = 'block';
    document.getElementById('analyzeBtn').disabled = false;
    setStatus('✓ Image loaded — tap Scan to build your listing', 'done');
  };
  reader.readAsDataURL(file);
}

async function analyzeAd() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) return alert('Enter your Anthropic API key and hit Save.\n\nGet one at console.anthropic.com');
  if (!imageBase64) return alert('Snap or upload an ad image first.');

  setLoading(true);
  setStatus('Analyzing ad...', 'working');

  const prompt = `You are an expert eBay listing creator. Analyze this advertisement image and extract all product information needed for an optimized eBay listing.

Respond ONLY with a valid JSON object. No markdown, no backticks, no extra text. Exact structure:

{
  "title": "keyword-rich eBay title max 80 chars",
  "price": 9.99,
  "conditionCode": "1000",
  "description": "3-5 sentence listing description highlighting features specs and what is included",
  "keywords": "comma,separated,keywords",
  "suggestedCategory": "category name",
  "brand": "brand or empty string",
  "model": "model or empty string",
  "extractedInfo": "2-3 line summary of what you found in the ad"
}

conditionCode values: 1000=New, 3000=Used, 4000=Very Good, 5000=Good, 6000=Acceptable, 7000=For Parts.
Use the price shown in the ad. If no price shown estimate fair market value.
Extract every visible detail: brand model features specs what is included any condition clues.`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1024,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: imageMimeType, data: imageBase64 } },
            { type: 'text', text: prompt }
          ]
        }]
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      const msg = err.error?.message || `HTTP ${resp.status}`;
      if (resp.status === 401) throw new Error('Invalid API key — check console.anthropic.com');
      if (resp.status === 429) throw new Error('Rate limit — wait a moment and try again');
      throw new Error(msg);
    }

    const data = await resp.json();
    const rawText = data.content?.map(b => b.text || '').join('') || '';
    const clean = rawText.replace(/```json|```/g, '').trim();
    const listing = JSON.parse(clean);
    populateListing(listing);
    setStatus('✓ Listing built — review and hit List on eBay', 'done');

  } catch (err) {
    console.error(err);
    if (err.message.includes('JSON')) {
      setStatus('Parse error — try scanning again', 'error');
    } else {
      setStatus('Error: ' + err.message, 'error');
    }
  } finally {
    setLoading(false);
  }
}

function populateListing(data) {
  document.getElementById('title').value = data.title || '';
  document.getElementById('price').value = data.price || '';
  document.getElementById('description').value = data.description || '';
  document.getElementById('keywords').value = data.keywords || '';

  if (data.conditionCode) {
    const sel = document.getElementById('condition');
    for (let opt of sel.options) {
      if (opt.value === String(data.conditionCode)) { sel.value = opt.value; break; }
    }
  }

  const card = document.getElementById('infoCard');
  let cardText = '📋 Extracted:\n';
  if (data.brand) cardText += 'Brand: ' + data.brand + '\n';
  if (data.model) cardText += 'Model: ' + data.model + '\n';
  if (data.suggestedCategory) cardText += 'Category: ' + data.suggestedCategory + '\n';
  if (data.extractedInfo) cardText += data.extractedInfo;
  card.textContent = cardText;
  card.classList.add('visible');

  document.getElementById('placeholderMsg').style.display = 'none';
  document.getElementById('result-panel').classList.add('visible');
  document.getElementById('ebayBtn').disabled = false;
  document.getElementById('copyBtn').disabled = false;
  updateCharCount('title', 'titleCount', 80);
}

function openEbay() {
  const title = encodeURIComponent(document.getElementById('title').value || '');
  const price = document.getElementById('price').value || '';
  const condition = document.getElementById('condition').value || '3000';
  const categoryId = document.getElementById('categoryId').value.trim();
  const listingType = document.getElementById('listingType').value;
  const description = encodeURIComponent(document.getElementById('description').value || '');

  let url = 'https://www.ebay.com/sl/sell?title=' + title;
  if (price) url += '&price=' + price;
  url += '&condition=' + condition + '&format=' + listingType;
  if (categoryId) url += '&cid=' + encodeURIComponent(categoryId);
  if (description) url += '&description=' + description;

  window.open(url, '_blank');
}

function copyListing() {
  const condition = document.getElementById('condition');
  const text = 'TITLE: ' + document.getElementById('title').value +
    '\nPRICE: $' + document.getElementById('price').value +
    '\nCONDITION: ' + (condition.options[condition.selectedIndex]?.text || '') +
    '\n\nDESCRIPTION:\n' + document.getElementById('description').value +
    '\n\nKEYWORDS: ' + document.getElementById('keywords').value;
  navigator.clipboard.writeText(text).then(() => setStatus('✓ Copied to clipboard', 'done'));
}

function setStatus(msg, type) {
  const el = document.getElementById('statusBar');
  el.textContent = msg;
  el.className = 'status-bar ' + (type || '');
}

function setLoading(on) {
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
  document.getElementById('analyzeLabel').textContent = on ? 'Analyzing...' : 'Scan & Build Listing';
  document.getElementById('analyzeBtn').disabled = on;
}

function updateCharCount(inputId, countId, max) {
  const len = document.getElementById(inputId).value.length;
  const el = document.getElementById(countId);
  el.textContent = len + ' / ' + max;
  el.className = 'char-count' + (len > max ? ' over' : len > max * 0.9 ? ' warn' : '');
}
</script>
</body>
</html>
